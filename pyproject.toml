[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "civil-lens"
version = "1.0.0"
description = "CivilLens: Transparent, Feedback-Tuned Screening of Abusive Online Language"
authors = [{ name = "Research Team", email = "team@civillens.local" }]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "easyocr>=1.7.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0.0"
]
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["checks"]

[tool.vercel]
entrypoint = "server.app:app"


