app:
  title: "CivilLens: Transparent, Feedback-Tuned Screening of Abusive Online Language"
  subtitle: "Academic Research Platform - Supervisor: Dr. Pradeepika Verma"
  version: "1.0.0"
  env: "development"
  host: "127.0.0.1"
  port: 8000
  debug: true

storage:
  database_path: "corpus/civil_lens.db"
  raw_data_dir: "corpus/source"
  processed_data_dir: "corpus/prepared"
  models_dir: "weights/snapshots"
  versions_dir: "weights/generations"
  feedback_dir: "corpus/reviews"
  reports_dir: "briefs/built"
  experiments_dir: "trials/outputs"

compute:
  device: "cpu" # 'cpu' or 'cuda'
  num_threads: 4
  batch_size: 16
  seed: 42

active_model:
  id: "polyglot-attention-v1"
  name: "Multilingual Code-Mixed Transformer Classifier"
  architecture: "transformer"
  version: "1.0"
  threshold: 0.50

ui:
  theme: "lumen"
  default_mode: "light" # 'light' or 'dark'

